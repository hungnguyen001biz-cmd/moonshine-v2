name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrappers executable
        run: |
          chmod +x gradlew
          chmod +x examples/android/Transcriber/gradlew

      - name: Inspect Gradle projects
        run: |
          ./gradlew projects
          ./gradlew tasks --all

      - name: Publish Moonshine library to Maven Local
        run: |
          ./gradlew publishToMavenLocal

      - name: Add Maven Local to Transcriber
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("examples/android/Transcriber/settings.gradle.kts")
          text = path.read_text()

          old = """repositories {
                  google()
                  mavenCentral()
              }"""

          new = """repositories {
                  mavenLocal()
                  google()
                  mavenCentral()
              }"""

          if old not in text:
              raise SystemExit("Không tìm thấy repositories block cần sửa")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build Transcriber APK
        working-directory: examples/android/Transcriber
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-transcriber-apk
          path: examples/android/Transcriber/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
