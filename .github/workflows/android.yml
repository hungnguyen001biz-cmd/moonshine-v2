name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x examples/android/Transcriber/gradlew

      - name: Use published Moonshine version
        run: |
          sed -i \
            's/moonshineVoice = "0.0.45"/moonshineVoice = "0.0.46"/' \
            examples/android/Transcriber/gradle/libs.versions.toml

          grep 'moonshineVoice' \
            examples/android/Transcriber/gradle/libs.versions.toml

      - name: Build debug APK
        working-directory: examples/android/Transcriber
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK_PATH=$(find \
            examples/android/Transcriber/app/build/outputs/apk \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK generated: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-transcriber-apk
          path: examples/android/Transcriber/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
